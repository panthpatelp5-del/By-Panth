<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>By Panth | Project Hub</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* CSS Reset & Variables */
        :root {
            --bg-color: #030305;
            --text-main: #ffffff;
            --text-muted: #a0a0ab;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Canvas Background */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        /* Layout */
        .container {
            width: 100%;
            max-width: 1200px;
            padding: 4rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 4rem;
        }

        header {
            text-align: center;
            margin-top: 2rem;
            animation: fadeInDown 1s ease-out;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(3rem, 8vw, 5.5rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #ffffff, #a0a0ab);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 span {
            background: linear-gradient(45deg, #04d9ff, #bc13fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(188, 19, 254, 0.4);
        }

        .subtitle {
            font-size: clamp(1.1rem, 2vw, 1.4rem);
            color: var(--text-muted);
            font-weight: 300;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Project Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
            width: 100%;
        }

        /* --- STYLE 1: Glassmorphism Card (For Hosted Websites) --- */
        .card {
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all var(--transition);
            overflow: hidden;
            z-index: 1;
            animation: fadeInUp 0.8s ease-out backwards;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(800px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), 
                                      var(--hover-color, rgba(255,255,255,0.1)), transparent 40%);
            opacity: 0;
            transition: opacity 0.5s;
            z-index: -1;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.01);
            border-color: var(--hover-color);
            box-shadow: 0 15px 35px -10px var(--hover-color);
        }

        .card:hover::before {
            opacity: 0.15;
        }

        .icon-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 3.5rem;
            height: 3.5rem;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            color: var(--hover-color);
            transition: all var(--transition);
        }

        .icon-wrapper i { font-size: 1.6rem; }

        .icon-wrapper span {
            font-family: 'Outfit', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .card:hover .icon-wrapper {
            transform: scale(1.1) rotate(-5deg);
            border-color: var(--hover-color);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
        }

        .card-info h3 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .card-info p {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.6;
        }

        .launch-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: auto;
            color: var(--hover-color);
            font-weight: 500;
            font-size: 0.95rem;
            opacity: 0;
            transform: translateY(15px);
            transition: all var(--transition);
        }

        .card:hover .launch-btn {
            opacity: 1;
            transform: translateY(0);
        }

        .card:hover .launch-btn i {
            transform: translateX(5px);
        }


        /* --- STYLE 2: Local File Row (For Unuploaded Local Folders) --- */
        .file-row {
            grid-column: 1 / -1; /* This makes it span the full width instead of being a square box */
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(90deg, rgba(20,20,25,0.8) 0%, rgba(10,10,12,0.8) 100%);
            border: 1px solid var(--card-border);
            border-left: 5px solid var(--hover-color);
            padding: 1.5rem 2.5rem;
            border-radius: 8px;
            text-decoration: none;
            color: inherit;
            transition: all var(--transition);
            animation: fadeInUp 0.8s ease-out backwards;
            margin-top: 1rem;
        }

        .file-row:hover {
            transform: translateX(12px); /* Slides right instead of floating up */
            background: linear-gradient(90deg, rgba(30,30,35,0.9) 0%, rgba(15,15,18,0.9) 100%);
            border-color: var(--hover-color);
            box-shadow: -15px 0px 30px -10px var(--hover-color);
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .file-icon {
            font-size: 2rem;
            color: var(--hover-color);
            background: rgba(255,255,255,0.03);
            padding: 1rem;
            border-radius: 8px;
            border: 1px dashed var(--hover-color);
        }

        .file-details h3 {
            font-family: 'Courier New', Courier, monospace; /* Hacker / Code aesthetic */
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.3rem;
            letter-spacing: -0.5px;
        }

        .file-details p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .file-action {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--hover-color);
            font-family: 'Courier New', Courier, monospace;
            font-weight: 700;
            font-size: 1.1rem;
            opacity: 0.5;
            transition: all var(--transition);
        }

        .file-row:hover .file-action {
            opacity: 1;
            transform: translateX(-5px);
        }

        /* Keyframes */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .container { padding: 3rem 1.5rem; }
            .card { padding: 2rem 1.5rem; }
            .launch-btn { opacity: 1; transform: translateY(0); }
            
            .file-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 1.5rem;
                padding: 1.5rem;
            }
            .file-action { opacity: 1; }
        }
    </style>
</head>

            {

            },
            {

                description: "This Is A Half Clone Of RedBus.",
                link: "./Main_RedBus_web.html", 
                color: "#4e0863",

            },
            {
                title: "Train Ticket Booking Form",
                description: "This Is Just A Example Of Train Ticket Booking Form.",
                link: "./Train_booking_web.html", 
                color: "#630834",
                isLocal: true // <--- THIS FLAG CHANGES THE STYLE
            },
            {
                title: "Hospital Form Fill-Up",
                description: "This Is A Just A Example Of Hospital Form.",
                link: "./Hospital_form_web.html", 
                color: "#084863",
                isLocal: true // <--- THIS FLAG CHANGES THE STYLE

        ];

        // --- 2. RENDER PROJECT CARDS ---
        const gridContainer = document.getElementById('project-grid');
        const fallbackColors = ["#04d9ff", "#bc13fe", "#00ff66", "#ff2a5f", "#facc15", "#ff5e00"];

        projects.forEach((project, index) => {
            const cardColor = project.color || fallbackColors[index % fallbackColors.length];

            // --- SMART LINK FIXER ---
            let finalUrl = project.link;
            if (finalUrl !== '#') {
                if (finalUrl.startsWith('./') || finalUrl.startsWith('/') || finalUrl.startsWith('file://')) {
                    // Local file, do nothing
                } else if (!finalUrl.startsWith('http://') && !finalUrl.startsWith('https://')) {
                    finalUrl = 'https://' + finalUrl;
                }
            }

            // --- CHOOSE WHICH STYLE TO DRAW ---
            if (project.isLocal) {
                // DRAW THE NEW FULL-WIDTH TERMINAL ROW
                const row = document.createElement('a');
                row.href = finalUrl;
                if (finalUrl !== '#') {
                    row.target = "_blank"; 
                    row.rel = "noopener noreferrer"; 
                }
                
                row.className = 'file-row';
                row.style.setProperty('--hover-color', cardColor);
                row.style.animationDelay = `${index * 0.1}s`; 

                row.innerHTML = `
                    <div class="file-info">
                        <div class="file-icon">
                            <i class="fa-solid fa-folder-tree"></i>
                        </div>
                        <div class="file-details">
                            <h3>${project.title}</h3>
                            <p>${project.description}</p>
                        </div>
                    </div>
                    <div class="file-action">
                        Launch Project <i class="fa-solid fa-terminal"></i>
                    </div>
                `;
                gridContainer.appendChild(row);

            } else {
                // DRAW THE NORMAL GLASS BOX
                let iconHTML = '';
                if (project.icon) {
                    iconHTML = `<i class="${project.icon}"></i>`;
                } else {
                    const initials = project.title.split(' ')
                                           .map(word => word[0])
                                           .join('')
                                           .substring(0, 2)
                                           .toUpperCase();
                    iconHTML = `<span>${initials}</span>`;
                }

                const card = document.createElement('a');
                card.href = finalUrl;
                if (finalUrl !== '#') {
                    card.target = "_blank"; 
                    card.rel = "noopener noreferrer"; 
                }
                
                card.className = 'card';
                card.style.animationDelay = `${index * 0.1}s`; 
                card.style.setProperty('--hover-color', cardColor);

                card.innerHTML = `
                    <div class="icon-wrapper">
                        ${iconHTML}
                    </div>
                    <div class="card-info">
                        <h3>${project.title}</h3>
                        <p>${project.description}</p>
                    </div>
                    <div class="launch-btn">
                        Launch Project <i class="fa-solid fa-arrow-right"></i>
                    </div>
                `;

                card.onmousemove = e => {
                    const rect = card.getBoundingClientRect(),
                          x = e.clientX - rect.left,
                          y = e.clientY - rect.top;
                    card.style.setProperty('--mouse-x', `${x}px`);
                    card.style.setProperty('--mouse-y', `${y}px`);
                };

                gridContainer.appendChild(card);
            }
        });

        // --- 3. BACKGROUND PARTICLE SYSTEM ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
                this.color = `rgba(${Math.floor(Math.random() * 50 + 150)}, 
                                  ${Math.floor(Math.random() * 100 + 100)}, 
                                  255, ${Math.random() * 0.4 + 0.1})`;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > width) this.x = 0;
                if (this.x < 0) this.x = width;
                if (this.y > height) this.y = 0;
                if (this.y < 0) this.y = height;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const particleCount = Math.floor((width * height) / 15000); 
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }
        initParticles();

        function animate() {
            ctx.clearRect(0, 0, width, height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                
                for (let j = i; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 100) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(188, 19, 254, ${0.1 - distance/1000})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }
        animate();
    </script>
