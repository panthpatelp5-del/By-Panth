        header {

        nav {

        }

        a {
            margin-right: 2vw;

        }

            color: white;
            font-size: 50px;
            display: flex;
            justify-content: center;
        }
        img{
            position: relative;
            top: 5vw;
            left: 24vw;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        video{
            position: relative;
            top: 4vw;
            left: 36vw;
        }
        .nextbutton{
            height: 100px;
            width: 100px;
            position: relative;
            left: 23vw;
            top: 21vw;
            display: inline-block;
        }
        .previousbutton{
            height: 100px;
            width: 100px;

            left: 8vw;
            top: 12vw;
        }
        iframe{
            height: 400px;
            width: 700px;
            position: relative;
            left: 20vw;
            top: 3vw;
        }
