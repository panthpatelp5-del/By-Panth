        body {

        header {
            width: 100%;
        }

        nav {
            background: linear-gradient(to right, #4b4a4a, #2e2e2e);

            list-style-type: none;
            display: flex;
            align-items: center;
            font-style: none;
            /* color: white; */

        }

        a {
            margin-right: 2vw;

        }

        }
        fieldset{

        legend{
            color: white;
            font-size: 50px;
            display: flex;
            justify-content: center;
        }
        img{
            height: 400px;
            width: 400px;
            position: relative;
            top: 5vw;
            left: 32vw;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        video{
            position: relative;
            top: 4vw;
            left: 36vw;
        }
        .nextbutton{
            height: 100px;
            width: 100px;

            left: 56vw;
            top: 16vh;
            display: inline-block;
        }
        .previousbutton{

            top: 3vw;
        }
        iframe{

            width: 700px;

            left: 19vw;

        }
