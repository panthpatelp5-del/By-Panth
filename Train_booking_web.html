<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panth Express</title>
    <link rel="shortcut icon" href="/saved pic/train.png" type="image/png">
    
    <style>
        /* General reset for margin and padding */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
            padding: 20px;
        }
        
        form {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        div {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        
        label {
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        
        input,
        select,
        button {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            width: 100%;
        }
        
        input:focus,
        select:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 4px rgba(0, 123, 255, 0.5);
        }
        
        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        
        button:hover {
            background-color: #0056b3;
        }

        #thank-you {
            display: none;
            text-align: center;
        }
        
        #thank-you h1 {
            color: #007bff; /* Blue color */
            font-size: 28px; /* Slightly larger font size */
            font-weight: bold; /* Bold text */
            text-align: center; /* Center-align the text */
            padding: 20px; /* Add padding around the text */
            background: rgba(0, 123, 255, 0.1); /* Light blue background */
            border: 2px solid rgba(0, 123, 255, 0.3); /* Border with transparency */
            border-radius: 10px; /* Rounded corners */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); /* Subtle shadow */
            margin: 20px auto; /* Center the element with margin */
            max-width: 500px; /* Limit the maximum width */
        }
    </style>
</head>

<body>
    <form id="booking-form">
        <div>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>
        </div>
        <div>
            <label for="surname">Surname</label>
            <input type="text" id="surname" name="surname" placeholder="Enter your surname" required>
        </div>
        <div>
            <label for="phone">Phone No.</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
        </div>
        <div>
            <label for="age">Age</label>
            <input type="number" id="age" name="age" placeholder="Enter your age" required>
        </div>
        <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>
        <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>
        <div>
            <label for="passengers">Number of Passengers</label>
            <input type="number" id="passengers" name="passengers" placeholder="Enter the number of passengers" required>
        </div>
        <div>
            <label for="booking-date">Booking Date</label>
            <input type="date" id="booking-date" name="booking-date" required>
        </div>
        <div>
            <label for="travel-date">Travel Date</label>
            <input type="date" id="travel-date" name="travel-date" required>
        </div>
        <div>
            <label for="destination">Surat To?</label>
            <select name="destination" id="destination" required>
                <option value="" disabled selected>select</option>
                <option value="jaipur">Jaipur</option>
                <option value="navsari">Navsari</option>
                <option value="amroli">Amroli</option>
                <option value="pune">Pune</option>
                <option value="andheri">Andheri</option>
                <option value="junagad">Junagad</option>
                <option value="bharuch">Bharuch</option>
                <option value="botad">Botad</option>
                <option value="ahmedabad">Ahmedabad</option>
                <option value="bardoli">Bardoli</option>
                <option value="bodhara">Bodhara</option>
                <option value="mumbai">Mumbai</option>
                <option value="bhavnagar">Bhavnagar</option>
                <option value="vadodara">Vadodara</option>
            </select>
        </div>
        <div>
            <button type="submit">Submit</button>
        </div>
        <div>
            <button type="reset">Reset</button>
        </div>
    </form>
    <div id="thank-you">
        <h1>Thanks for applying!<br>Your tickets will be sent within 24 hours to your email or via messages.</h1>
    </div>

    <script>
        document.getElementById("booking-form").addEventListener("submit", function(event) {
            event.preventDefault(); // Prevent page reload
            document.getElementById("booking-form").style.display = "none";
            document.getElementById("thank-you").style.display = "block";
        });
    </script>
</body>

</html>
